name: Build wheels and sdist and upload to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # No Linux ARM: GalSim and batoid publish no aarch64 wheels, so a
        # danish aarch64 wheel cannot have its dependencies satisfied.  macOS
        # arm64 is unaffected -- both publish that.
        os: [ubuntu-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD_VERBOSITY: 3
          # No cp315 until GalSim has a cp315 wheel.  A danish wheel is only
          # installable if its dependencies are, and building GalSim from
          # source needs fftw, which most users will not have.
          # Free-threaded builds get their own identifier, so both patterns
          # are needed to cover cp315 and cp315t.
          CIBW_SKIP: cp315-* cp315t-*
          # Smoke test each wheel before it ships.  The import alone loads
          # _danish, and the render then calls into it, so a wheel whose
          # extension is missing, mislinked or built for the wrong ABI fails
          # here rather than on a user's machine.  Deliberately not the test
          # suite: that needs GalSim and batoid, which have no wheels for
          # every interpreter we build for.
          CIBW_TEST_COMMAND: >-
            python -c "import numpy as np, danish;
            f = danish.DonutTriangleFactory(nrad=6, R_outer=4.18,
            R_inner=2.5498, focal_length=10.31, pixel_scale=10e-6);
            ab = np.zeros(22); ab[4] = 20e-6;
            img = f.image(aberrations=ab, thx=0.0, thy=0.0, npix=181);
            assert img.sum() > 0, img.sum();
            print('danish', danish.__version__, 'render ok', img.shape)"
          CIBW_TEST_REQUIRES: numpy

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  merge_wheels:
    name: Merge wheels
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Merge wheels
        uses: actions/upload-artifact/merge@v7
        with:
          name: wheels
          pattern: "cibw-wheels-*"

  build_sdist:
    name: Build sdist and upload to PyPI
    needs: [merge_wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      attestations: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U build setuptools_scm

      - name: Extract version
        run: |
          echo "PACKAGE_VERSION=$(python -c 'from setuptools_scm import get_version; print(get_version())')" >> $GITHUB_ENV
          python -c 'from setuptools_scm import get_version; print(get_version())'

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: wheels
          path: ./wheels

      - name: Build sdist
        run: |
          python -m build --sdist .
          ls -l dist
          tar tvfz dist/danish-*.tar.gz

      - name: Copy wheels to dist
        run: |
          cp wheels/*.whl dist/
          ls -la dist/

      - name: Generate attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Publish to TestPyPI if alpha
        if: "contains(env.PACKAGE_VERSION, 'a') && !contains(env.PACKAGE_VERSION, '.dev')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

      - name: Publish to PyPI if stable release
        if: "!contains(env.PACKAGE_VERSION, 'a') && !contains(env.PACKAGE_VERSION, '.dev')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  deploy-docs:
    name: Deploy versioned docs
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install GalSim + batoid
        run: python -m pip install GalSim batoid

      - name: Install danish
        run: python -m pip install -e .

      - name: Install MkDocs dependencies
        run: python -m pip install mkdocs-material mkdocstrings[python] mkdocs-autorefs mike

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Deploy docs
        run: |
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
