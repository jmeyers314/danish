name: danish CI

on:
  push:
    branches:
      - main
      - releases/*

  pull_request:
    branches:
      - main
      - releases/*

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        py: ['3.10', '3.11', '3.12', '3.13']
        CC: [ gcc ]
        CXX: [ g++ ]
        include:
          - os: macos-latest
            py: '3.10'
            CC: cc
            CXX: c++
          - os: ubuntu-latest
            py: '3.10'
            CC: clang
            CXX: clang++

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Print github context properties
        run: |
          echo 'event: ${{ github.event_name }}'
          echo 'sha: ${{ github.sha }}'
          echo 'ref: ${{ github.ref }}'
          echo 'head_ref: ${{ github.head_ref }}'
          echo 'base_ref: ${{ github.base_ref }}'
          echo 'event.before: ${{ github.event.before }}'
          echo 'event.after: ${{ github.event.after }}'

      - name: Set up Python ${{ matrix.py }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Update pip
        run: python -m pip install -U pip

      - name: Install GalSim + batoid
        run: |
          python -m pip install GalSim batoid

      - name: Build danish
        run: python -m pip install -e .

      - name: List all installed packages for reference
        run: python -m pip list

      - name: Install test requirements
        run: python -m pip install -U pytest pytest-xdist pytest-cov

      - name: Run unit tests
        run: pytest -n2 --cov=danish --cov-report=xml --cov-config tests/.coveragerc

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'macos-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: service
          name: service-${{ github.run_id }}
          verbose: true
